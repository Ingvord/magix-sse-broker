# docker compose -f deploy/compose.yaml up --build
# Then: curl -N localhost:8888/magix/api/subscribe
services:
  magix:
    build:
      context: ..
      dockerfile: Dockerfile
    image: magix:native
    ports:
      - "8888:8888"
    environment:
      MAGIX_HEARTBEAT: 15s
      MAGIX_BUFFER_SIZE: "256"
    restart: unless-stopped
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
